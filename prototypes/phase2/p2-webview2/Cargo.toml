[package]
name = "p2-webview2"
description = "ADR 0008 phase 2, P2: presenter B2 (WebView2 shared buffer -> WebGL2/WebGPU) against B1. Not part of the app."
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace: the prototypes are built apart from the app (ADR 0008 section 8.1).
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pw-raw = { path = "../../../crates/pw-raw" }
tauri = { version = "2", features = ["custom-protocol"] }
serde_json = "1"
zune-jpeg = "0.4"
# Already in the app's dependency tree through Tauri/wry (same versions); used here directly to
# reach the WebView2 shared-buffer API. No new crate.
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
debug = "line-tables-only"

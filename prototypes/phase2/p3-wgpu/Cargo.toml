[package]
name = "p3-wgpu"
description = "ADR 0008 phase 2, P3: presenter A (wgpu surface for the image area, Tauri webview on top). Not part of the app."
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace: the prototypes are built apart from the app (ADR 0008 section 8.1).
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pw-raw = { path = "../../../crates/pw-raw" }
# "unstable" gives Window + child webviews (the webview over or beside the wgpu surface).
tauri = { version = "2", features = ["custom-protocol", "unstable"] }
serde_json = "1"
zune-jpeg = "0.4"
# New dependency, approved by the owner for P3 only (2026-11-05).
wgpu = "27"
# Already in the app's dependency tree through Tauri/wry (same versions).
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
debug = "line-tables-only"

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>P3 wgpu</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body.strip { background: #2a2a2a; }
  #status { position: absolute; left: 8px; bottom: 8px; color: #ccc; font: 12px system-ui; white-space: pre;
            background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 3px; }
  body.strip #status { top: 14px; bottom: auto; background: none; }
</style>
</head>
<body>
<div id="status">P3: starting...</div>
<script>
"use strict";
const { invoke } = window.__TAURI__.core;
const statusEl = document.getElementById("status");
(async () => {
  const info = await invoke("p3_info");
  if (info.layout === "strip") document.body.classList.add("strip");
  if (!info.interactive) { statusEl.textContent = `P3 (${info.layout}): measurement run`; return; }
  let busy = false, pending = 0;
  const show = async (d) => {
    if (busy) { pending += d; return; }
    busy = true;
    try {
      const r = await invoke("p3_show", { delta: d });
      statusEl.textContent = `P3 ${info.interactive} #${r.idx}  present ${r.to_present_ms.toFixed(1)} ms  gpu ${r.gpu_done_ms.toFixed(1)} ms`;
    } catch (e) { statusEl.textContent = `P3 error: ${e}`; }
    busy = false;
    if (pending) { const p = pending; pending = 0; show(p); }
  };
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") show(1);
    if (e.key === "ArrowLeft") show(-1);
  });
  show(0);
})();
</script>
</body>
</html>

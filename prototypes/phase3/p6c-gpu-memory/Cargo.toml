[package]
name = "p6c-gpu-memory"
description = "ADR 0008 P6c: GPU PPG memory budget and texture-cache validation in presenter B2-res. Not part of the app."
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace: the prototypes are built apart from the app (ADR 0008 section 8.1).
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde_json = "1"
# Already in the app's dependency tree through Tauri/wry (same versions). No new crate.
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
debug = "line-tables-only"

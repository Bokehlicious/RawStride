[package]
name = "p7-egui-presenter"
description = "ADR 0008 / GUI_REQUIREMENTS P7: image presentation in eframe + egui (CPU PPG views as egui textures). Not part of the app."
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace: prototypes are built apart from the app (ADR 0008 §8.1).
[workspace]

[build-dependencies]
cc = "1"

[dependencies]
# Owner-approved 2026-11-07 (GUI_REQUIREMENTS §6): eframe/egui 0.37.0, pinned, lean features.
# wgpu and glow are both compiled for the renderer comparison (GUI_REQUIREMENTS §4).
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu", "glow", "accesskit", "default_fonts", "clipboard"] }

[profile.release]
debug = "line-tables-only"

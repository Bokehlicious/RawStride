name: Feature request
description: An idea for something RawStride should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Many decisions are already recorded, with their reasons, in the
        [ADRs](https://github.com/Bokehlicious/RawStride/tree/main/docs/adr) and the
        [backlog](https://github.com/Bokehlicious/RawStride/blob/main/docs/tasks/backlog.md).
        A look there first may answer the question.
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task in your own work that RawStride makes hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How you picture RawStride helping, for example a key, a menu entry or a setting.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: In another program, or a workaround.
  - type: dropdown
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - "No, just the idea"
        - "Yes, with some guidance"
        - "Yes"

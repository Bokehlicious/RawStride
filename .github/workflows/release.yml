# Builds a RawStride release on a clean Windows machine (ADR 0031 RL6, task T229). It runs
# tools/release-build.ps1: THIRD-PARTY-NOTICES.txt checked against a fresh run of
# tools/third-party-notices.ps1, the release exe built with the build machine's paths remapped and
# checked, the portable zip (tools/package-dist.ps1), the MSI (tools/package-msi.ps1, ADR 0031 RL9,
# with WiX installed as a .NET tool below), SHA256SUMS.txt for both and the release notes from
# CHANGELOG.md. The four files are kept as the artifact "release".
#
# On a pushed tag v<version> (a tag on main naming pw-loupe's version) it then creates a DRAFT
# GitHub Release with them; it never publishes. The owner reads the draft and publishes it by hand
# (RL7). Started by hand (Actions > Release > Run workflow) on any branch, it makes the artifact but
# no release; its input "section" names the CHANGELOG.md section for the notes.
#
# It runs no tests: a tag is put only on a main commit whose CI run is green (RL7).
#
# The cargo cache and the vcpkg binary cache that ci.yml saves are only restored here, never saved,
# so a release run makes no such cache entries. The cargo cache's target part does not help (the
# remapping flags rebuild everything); only its registry part does.
#
# Only GitHub's own actions, each pinned to a full commit SHA with its version in a comment.
# The Rust version lives only in rust-toolchain.toml, the vcpkg baseline only in vcpkg.json.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      section:
        description: "CHANGELOG.md section for the release notes: Unreleased, or a version such as 0.1.0"
        type: string
        required: true
        default: Unreleased

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release build on Windows
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # A smaller target folder to cache.
      CARGO_INCREMENTAL: "0"
      VCPKG_TRIPLET: x64-windows-static-md
      CARGO_ABOUT_VERSION: "0.9.3"
      # Must match $wixVersion in tools/package-msi.ps1, which checks it.
      WIX_VERSION: "7.0.1"
    defaults:
      run:
        shell: powershell

    steps:
      - name: Enable Git long paths
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # fetch-depth 0: the whole history and origin/main, for the tag check below.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Exactly ci.yml's path list, key and restore key: the path list is part of the cache's identity.
      - name: Restore the Cargo registry and target cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Cache cargo-about
        id: cargo-about-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-about.exe
          key: ${{ runner.os }}-cargo-about-${{ env.CARGO_ABOUT_VERSION }}

      - name: Install cargo-about
        if: steps.cargo-about-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-about --locked --version $env:CARGO_ABOUT_VERSION --features cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clone vcpkg at the baseline in vcpkg.json
        run: |
          $baseline = (Get-Content -Raw -LiteralPath 'vcpkg.json' | ConvertFrom-Json).'builtin-baseline'
          if ($baseline -notmatch '^[0-9a-f]{40}$') {
            Write-Output "vcpkg.json has no valid builtin-baseline: '$baseline'"
            exit 1
          }
          Write-Output "vcpkg baseline: $baseline"
          # Not the runner's preinstalled vcpkg: a clone outside the checkout, holding the baseline commit.
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git init --quiet $vcpkgRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $vcpkgRoot remote add origin https://github.com/microsoft/vcpkg.git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $vcpkgRoot fetch --quiet --depth 1 origin $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $vcpkgRoot checkout --quiet FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binaryCache = Join-Path $env:RUNNER_TEMP 'vcpkg-bincache'
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$vcpkgRoot" -Encoding ascii
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_BINARY_CACHE=$binaryCache" -Encoding ascii
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_BINARY_SOURCES=clear;files,$binaryCache,readwrite" -Encoding ascii

      - name: Bootstrap vcpkg
        run: |
          & (Join-Path $env:VCPKG_ROOT 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Restored as in ci.yml, never saved here.
      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\vcpkg-bincache
          key: ${{ runner.os }}-vcpkg-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}-

      - name: Install the native libraries with vcpkg
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_BINARY_CACHE | Out-Null
          # In the repository root, so the libraries land in .\vcpkg_installed (build.rs,
          # tools/third-party-notices.ps1).
          & (Join-Path $env:VCPKG_ROOT 'vcpkg.exe') install --triplet $env:VCPKG_TRIPLET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # On a tag only. GitHub's powershell shell would end the step on git's exit code 1 without a
      # message, so the code is handled here.
      - name: Check that the tag is on main and names pw-loupe's version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Continue'
          git merge-base --is-ancestor HEAD origin/main
          $code = $LASTEXITCODE
          if ($code -eq 1) {
            Write-Output "The tag $env:TAG_NAME is not on main. A release is tagged only on a main commit (ADR 0031 RL7)."
            exit 1
          }
          if ($code -ne 0) {
            Write-Output "git merge-base --is-ancestor HEAD origin/main failed with exit code $code."
            exit $code
          }
          $metadataLines = cargo metadata --format-version 1 --no-deps --locked --offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = ($metadataLines -join "`n") | ConvertFrom-Json
          $loupePackages = @($metadata.packages | Where-Object { $_.name -eq 'pw-loupe' })
          if ($loupePackages.Count -ne 1) {
            Write-Output "cargo metadata lists $($loupePackages.Count) packages named pw-loupe, expected 1."
            exit 1
          }
          $version = $loupePackages[0].version
          if ($env:TAG_NAME -cne "v$version") {
            Write-Output "The tag $env:TAG_NAME does not name pw-loupe's version $version (expected v$version)."
            exit 1
          }
          Write-Output "The tag $env:TAG_NAME is on main and names pw-loupe's version $version."
          exit 0

      # WiX as a .NET tool (the runner has the .NET SDK; ADR 0031 RL9-Q1). The .NET tools folder is
      # always added to GITHUB_PATH, so wix is found in the next steps even if the runner's PATH
      # lacks it (harmless if it is already there).
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $toolsFolder = Join-Path $env:USERPROFILE '.dotnet\tools'
          $env:PATH = "$toolsFolder;$env:PATH"
          wix --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value $toolsFolder -Encoding ascii

      - name: Run tools/release-build.ps1
        env:
          IS_TAG_RUN: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          TAG_NAME: ${{ github.ref_name }}
          SECTION_INPUT: ${{ inputs.section }}
        run: |
          if ($env:IS_TAG_RUN -eq 'true') {
            $section = $env:TAG_NAME -replace '^v', ''
          }
          else {
            $section = $env:SECTION_INPUT
          }
          .\tools\release-build.ps1 -Section $section

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            target/dist/RawStride-*-windows-x64.zip
            target/dist/RawStride-*-windows-x64.msi
            target/dist/SHA256SUMS.txt
            target/dist/release-notes.md
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell

    steps:
      # With name given, the files land in the workspace without a subfolder.
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      # Fails if a release for the tag already exists: the owner deletes the draft and runs it again.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $version = $env:TAG_NAME -replace '^v', ''
          $zip = "RawStride-$version-windows-x64.zip"
          $msi = "RawStride-$version-windows-x64.msi"
          $arguments = @('release', 'create', $env:TAG_NAME, '--repo', $env:REPOSITORY, '--verify-tag', '--draft')
          # Every version, 0.x included, is a regular release (ADR 0031 RL-Q14).
          $arguments += @('--title', "RawStride $version", '--notes-file', 'release-notes.md', $zip, $msi, 'SHA256SUMS.txt')
          gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

[package]
name = "preview-bench"
description = "Measures read and JPEG decode time of embedded RAW previews (development tool)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# libjpeg-turbo via its TurboJPEG C API, linked statically from vcpkg (manifest mode):
#   vcpkg install --triplet x64-windows-static-md      (in the repo root)
#   cargo run -p preview-bench --profile profiling --features turbojpeg -- <metadata.csv>
turbojpeg = []

[dependencies]
# Pure-Rust decoders for the baseline.
zune-jpeg = "0.4"
jpeg-decoder = { version = "0.3", default-features = false } # no rayon (may still use worker threads)

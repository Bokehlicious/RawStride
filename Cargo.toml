[workspace]
resolver = "3"
members = ["crates/*", "src-tauri", "tools/rea-probe", "tools/preview-bench", "tools/raw-decode-bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
authors = ["Tobias Nykänen"]
repository = ""
license = "GPL-3.0-or-later" # docs/adr/0002-licensing.md

[workspace.dependencies]
# Internal crates
pw-core = { path = "crates/pw-core" }
pw-raw = { path = "crates/pw-raw" }
pw-libraw = { path = "crates/pw-libraw" }
pw-libjpeg = { path = "crates/pw-libjpeg" }
pw-rawview = { path = "crates/pw-rawview" }
pw-viewcore = { path = "crates/pw-viewcore" }
pw-metadata = { path = "crates/pw-metadata" }
pw-catalog = { path = "crates/pw-catalog" }
pw-ingest = { path = "crates/pw-ingest" }
pw-thumbcache = { path = "crates/pw-thumbcache" }
pw-render = { path = "crates/pw-render" }
pw-tiff = { path = "crates/pw-tiff" }
pw-colour = { path = "crates/pw-colour" }
pw-imagecheck = { path = "crates/pw-imagecheck" }
# External dependencies are added here (pinned once) when implementation starts.
# eframe/egui 0.37.0, pinned exactly; features as approved (GUI_REQUIREMENTS §6, ADR 0009 §6.1).
egui = { version = "=0.37.0", default-features = false }
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "accesskit", "default_fonts", "clipboard"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# Keep image decoding usable in debug builds.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.build-override]
# Build scripts without debug info. Some antivirus programs flag the debug build of the
# thiserror 2.0.21 build script (Gen:Variant.Fugrafa, a false positive) and
# blocks it even inside an excluded target folder (2026-11-11).
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = true

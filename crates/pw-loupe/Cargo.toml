[package]
name = "pw-loupe"
description = "RawStride: the egui program with loupe, contact sheet, folder tabs and import (ADR 0009-0012)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "rawstride"
path = "src/main.rs"

[dependencies]
pw-viewcore = { workspace = true, features = ["native"] }
pw-render.workspace = true
pw-raw.workspace = true
pw-metadata.workspace = true
pw-imagecheck.workspace = true
pw-thumbcache.workspace = true
pw-ingest.workspace = true
pw-core.workspace = true
pw-colour.workspace = true
egui.workspace = true
eframe.workspace = true
rfd = { version = "=0.17.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_UI_ColorSystem"] }

[dev-dependencies]
moxcms = "=0.8.1"

[package]
name = "pw-viewcore"
description = "View core of the egui loupe: view model, plan, budgets and workers (ADR 0009)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# The real decoders: LibRaw with PPG through pw-libraw, libjpeg-turbo through pw-libjpeg for
# the embedded JPEG that pw-raw locates, and pw-tiff for TIFF files (ADR 0015). Without it the
# core is generic and is tested with simulated decoders, so its tests need no native libraries.
native = ["dep:pw-libraw", "dep:pw-libjpeg", "dep:pw-raw", "dep:pw-tiff", "dep:pw-colour"]

[dependencies]
pw-libraw = { workspace = true, optional = true }
pw-libjpeg = { workspace = true, optional = true }
pw-raw = { workspace = true, optional = true }
pw-tiff = { workspace = true, optional = true }
pw-colour = { workspace = true, optional = true }
pw-resample.workspace = true

[dev-dependencies]
pw-raw.workspace = true
tiff = "=0.9.1"
moxcms = "=0.8.1"

[package]
name = "photoworkflow"
description = "PhotoWorkflow – fast RAW culling, ingest and metadata (Tauri 2 app shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pw-raw.workspace = true
pw-metadata.workspace = true
pw-ingest.workspace = true
# RAW rendering (ADR 0006): LibRaw with OpenMP, statically linked; needs vcomp140.dll at run time.
pw-libraw.workspace = true
# RAW job engine with the LibRaw decoder (ADR 0006).
pw-rawview = { workspace = true, features = ["libraw"] }
# "custom-protocol" embeds ui/web into the binary, so a plain `cargo run` works
# without the Tauri CLI or a dev server.
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain TIFF viewing: decode the image data and serve it as JPEG (pure Rust, MIT).
tiff = "0.9"
jpeg-encoder = "0.7"
